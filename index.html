<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1622'/%3E%3Crect x='6' y='17' width='20' height='8' rx='2' fill='%23d93b2b'/%3E%3Crect x='10' y='11' width='12' height='7' rx='2' fill='%23d93b2b'/%3E%3Ccircle cx='10' cy='25' r='3' fill='%23131519'/%3E%3Ccircle cx='22' cy='25' r='3' fill='%23131519'/%3E%3C/svg%3E" />
	<title>Island Drive</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}

		html,
		body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background: #0b1622;
		}

		#game {
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}

		#hud {
			position: fixed;
			inset: 0;
			pointer-events: none;
			padding: 16px;
			color: #f2f7ff;
			text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
		}

		#title {
			font-size: 15px;
			font-weight: 600;
			letter-spacing: 0.02em;
		}

		#seed {
			margin-top: 2px;
			font-size: 12px;
			opacity: 0.75;
			font-variant-numeric: tabular-nums;
		}

		#controls {
			position: absolute;
			left: 16px;
			bottom: 16px;
			font-size: 12px;
			line-height: 1.7;
			opacity: 0.85;
		}

		kbd {
			display: inline-block;
			min-width: 1.1em;
			padding: 1px 5px;
			border-radius: 4px;
			border: 1px solid rgba(255, 255, 255, 0.35);
			background: rgba(0, 0, 0, 0.3);
			font-family: inherit;
			font-size: 11px;
			text-align: center;
		}

		#speedometer {
			position: absolute;
			right: 16px;
			bottom: 16px;
			font-size: 34px;
			font-weight: 600;
			line-height: 1;
			font-variant-numeric: tabular-nums;
		}

		#speedometer span {
			font-size: 13px;
			font-weight: 400;
			opacity: 0.75;
			margin-left: 4px;
		}

		#speed-value {
			font-weight: 600;
		}

		#status {
			margin-top: 4px;
			font-size: 12px;
			color: #ffe1a8;
			min-height: 1em;
		}

		#airborne {
			margin-top: 4px;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #9fe3ff;
			opacity: 0;
			transition: opacity 0.12s ease;
		}

		#airborne.on {
			opacity: 1;
		}

		#loading {
			position: fixed;
			inset: 0;
			display: grid;
			place-content: center;
			background: #0b1622;
			color: #cfe2f5;
			font-size: 14px;
			letter-spacing: 0.04em;
			transition: opacity 0.4s ease;
		}

		#loading.hidden {
			opacity: 0;
			pointer-events: none;
		}
	</style>
</head>

<body>
	<canvas id="game"></canvas>

	<div id="hud">
		<div>
			<div id="title">Island Drive</div>
			<div id="seed">seed —</div>
			<div id="status"></div>
			<div id="airborne">airborne</div>
		</div>
		<div id="controls">
			<div><kbd>↑</kbd> accelerate &nbsp; <kbd>↓</kbd> brake / reverse</div>
			<div><kbd>←</kbd> <kbd>→</kbd> steer</div>
			<div><kbd>R</kbd> new island &nbsp; <kbd>Space</kbd> jump to spawn</div>
		</div>
		<div id="speedometer"><b id="speed-value">0</b><span>km/h</span></div>
	</div>

	<div id="loading">generating island…</div>

	<script type="module" src="/src/main.js"></script>
</body>

</html>
